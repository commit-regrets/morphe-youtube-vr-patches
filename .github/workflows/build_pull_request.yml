name: Build (pull request)

# Nothing builds on a push, on purpose. A pull request into `main` is the point at which we want to
# know the bundle still compiles, and `workflow_dispatch` allows building any branch on demand.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build the bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # The same two jars the release needs: android.jar for javac, R8 for d8. Neither exists on the
      # runner, and without them the extension cannot be compiled into the bundle
      # (see patches/build.gradle.kts).
      - name: Provide the Android platform jar and R8
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/platform.zip" \
            https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          unzip -q -o "$tools/platform.zip" -d "$tools"
          echo "ANDROID_JAR=$(find "$tools" -name android.jar | head -n1)" >> "$GITHUB_ENV"
          curl -fsSL -o "$tools/r8.jar" \
            https://maven.google.com/com/android/tools/r8/9.5.23/r8-9.5.23.jar
          echo "R8_JAR=$tools/r8.jar" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew buildAndroid --no-daemon

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-bundle
          path: patches/build/libs/patches-!(*sources*|*javadoc*).mpp
          retention-days: 7
          if-no-files-found: error
