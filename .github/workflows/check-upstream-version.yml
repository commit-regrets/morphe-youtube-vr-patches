name: Check Upstream Version

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: check-upstream-version
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Meta Quest Store
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Query Meta Quest Store
        id: check
        run: node scripts/check-upstream-version.mjs

      - name: Process upstream update notification
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.check.outputs.latest_version }}
          BODY_FILE: ${{ steps.check.outputs.issue_body_path }}
        run: |
          TITLE="Upstream Update: YouTube VR $NEW_VERSION is available on Meta Quest Store"

          echo "Searching for existing issue with title '$TITLE'..."
          EXISTING_ISSUE=$(gh issue list --search "$TITLE in:title" --state all --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for version $NEW_VERSION. Skipping duplicate issue creation."
            exit 0
          fi

          echo "Ensuring 'upstream-update' label exists..."
          gh label create "upstream-update" \
            --color "0E8A16" \
            --description "New upstream app release detected on Meta Quest Store" \
            --force || true

          echo "Opening GitHub Issue for YouTube VR $NEW_VERSION..."
          gh issue create \
            --title "$TITLE" \
            --label "upstream-update" \
            --body-file "$BODY_FILE"
