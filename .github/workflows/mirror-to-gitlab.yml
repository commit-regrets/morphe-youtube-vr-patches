name: Mirror to GitLab

# Keeps the GitLab copy identical to GitHub. One-way on purpose: GitHub is the source of truth, and a
# mirror is only useful if it cannot diverge. The deploy key below holds write access to exactly one
# project, and any other repository is deliberately outside this arrangement.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

# The mirror only reads this repository (checkout) and pushes to GitLab with the deploy key
# above, so the token needs nothing beyond reading the code. Pinned explicitly because the
# repository default is broader -- found by CodeQL's actions/missing-workflow-permissions as
# soon as the `actions` language was added to codeql.yml.
permissions:
  contents: read

# Never cancel a mirror half-way; a stale mirror is worse than a slow one.
concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    name: Push to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all refs and tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Inline rather than webfactory/ssh-agent: that action still targets Node.js 20, which GitHub is
      # now forcing onto Node 24 with a deprecation warning on every run. Six lines of shell do the
      # same job with nothing to keep current.
      - name: Load the GitLab deploy key
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$GITLAB_DEPLOY_KEY" > ~/.ssh/gitlab_deploy
          chmod 600 ~/.ssh/gitlab_deploy
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/gitlab_deploy
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Trust gitlab.com
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 gitlab.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push branches and tags
        run: |
          set -euo pipefail
          git remote add gitlab "${{ vars.GITLAB_REMOTE_URL }}"
          # Ref-for-ref rather than --mirror: remote-tracking refs become real branches, tags are
          # copied, and --prune removes a branch deleted here so the mirror cannot rot.
          git push --prune gitlab \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"